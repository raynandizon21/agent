services:
  forwarder:
    build: .
    image: telegram-forwarder
    container_name: telegram-forwarder
    restart: unless-stopped
    env_file: .env
    environment:
      # Keep the session file and log inside the mounted volume so they survive
      # container rebuilds. These override whatever is in .env.
      - SESSION_NAME=data/user_session
      - LOG_FILE=data/forwarder.log
    volumes:
      - ./data:/app/data
    # First login needs an interactive terminal — do it once with:
    #   docker compose run --rm forwarder python main.py --login
    # then start normally with:
    #   docker compose up -d
